name: okernel

on:
  push:
  pull_request:
  workflow_dispatch:

# SysToolchain is resolved as an xmake package. Until SysToolchain publishes
# release archives it is built from source, so the package cache is keyed on
# the toolchain version and architecture and the source build happens once per
# key instead of once per run.
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - i386
          - x86_64
          - aarch64
          - arm32
          - rv64
          - rv32
          - loongarch64
          - mips
          - mips64
          - ppc
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Cache SysToolchain package
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages/s/systoolchain
          key: systoolchain-0.1.0-${{ runner.os }}-${{ matrix.arch }}
      - name: Configure architecture
        run: xmake f -c -y -m debug -a ${{ matrix.arch }}
      - name: Build okernel library
        run: xmake -y -b okernel
      - name: Run xmake tests (profile and booted QEMU debug kernel)
        run: xmake test
      - name: Export kernel SDK
        run: xmake -y -b kernel-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-sdk-${{ matrix.arch }}-debug
          path: build/sdk/${{ matrix.arch }}/debug
