name: okernel

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - i386
          - x86_64
          - aarch64
          - arm32
          - rv64
          - rv32
          - loongarch64
          - mips
          - mips64
          - ppc
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Configure architecture
        run: xmake f -c -y -m debug -a ${{ matrix.arch }}
      - name: Build okernel library
        run: xmake -y -b okernel
      - name: Run xmake tests
        run: xmake test
