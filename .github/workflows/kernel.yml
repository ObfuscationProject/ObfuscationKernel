name: okernel

on:
  push:
  pull_request:
  workflow_dispatch:

# SysToolchain is resolved as an xmake package from its GitHub release archives;
# the installed package is cached per toolchain version and architecture. The
# packaged QEMU links the host GLib, Pixman and SDL2 shared libraries.
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the ext4 module layout
        run: python3 scripts/check_ext4_layout.py
      - name: Check the native runtime split ratchet
        run: python3 scripts/check_runtime_split.py
  # Hosted model suites (scope=model) for the P1 memory, allocator, page cache,
  # VM and IRQ/wait/time mechanisms, under ASan and UBSan with the host g++.
  hosted-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - boot_memory
          - e820_memory
          - fdt_memory
          - physical_map
          - frame_allocator
          - slab
          - page_cache
          - native_page_pool
          - native_mapping_pages
          - mapping_view
          - native_vm
          - process_resources
          - irq_wait_time
    steps:
      - uses: actions/checkout@v4
      # Some runners build their hosted binaries through a generated xmake project.
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Run hosted model suite
        run: python3 -B scripts/test_${{ matrix.suite }}.py --sanitize
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch:
          - i386
          - x86_64
          - aarch64
          - arm32
          - rv64
          - rv32
          - loongarch64
          - mips
          - mips64
          - ppc
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Install QEMU runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0t64 libpixman-1-0 libsdl2-2.0-0
      - name: Cache SysToolchain package
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages/s/systoolchain
          key: systoolchain-0.1.0-${{ runner.os }}-${{ matrix.arch }}
      - name: Configure architecture
        run: xmake f -c -y -m debug -a ${{ matrix.arch }}
      - name: Build okernel library
        run: xmake -y -b okernel
      - name: Run xmake tests (profile and booted QEMU debug kernel)
        run: xmake test
      - name: Export kernel SDK
        run: xmake -y -b kernel-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-sdk-${{ matrix.arch }}-debug
          path: build/sdk/${{ matrix.arch }}/debug
      - name: Build eager fork fallback
        run: |
          xmake f -y -m debug -a ${{ matrix.arch }} --native_cow_fork=n
          xmake -y -b okernel_image
